<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meesho Login - Demo</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f8f8f8;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .login-box {
            width: 380px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.12);
            padding: 35px;
        }

        .logo {
            text-align: center;
            color: #e52b88;
            font-size: 36px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            color: #444;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus {
            border-color: #e52b88;
            outline: none;
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #e52b88;
            color: white;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #c91f73;
        }

        .forgot {
            text-align: right;
            margin: 12px 0 20px;
        }

        .forgot a {
            color: #e52b88;
            text-decoration: none;
        }

        .signup {
            text-align: center;
            margin-top: 25px;
            color: #555;
        }

        .signup a {
            color: #e52b88;
            font-weight: bold;
            text-decoration: none;
        }

        .demo {
            margin-top: 20px;
            padding: 10px;
            background: #fff1f7;
            color: #555;
            text-align: center;
            border-radius: 6px;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="login-box">

        <div class="logo">meesho</div>

        <h2>Login to your account</h2>

        <form onsubmit="loginDemo(event)">

            <label>Mobile Number</label>
            <input
                type="tel"
                id="mobile"
                placeholder="Enter mobile number"
                maxlength="10"
                required
            >

            <label>Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter password"
                required
            >

            <div class="forgot">
                <a href="#">Forgot Password?</a>
            </div>

            <button class="login-btn" type="submit">
                Login
            </button>

        </form>

        <div class="signup">
            Don't have an account?
            <a href="#">Sign Up</a>
        </div>

        <div class="demo">
            Demo page for HTML/CSS/JavaScript practice
        </div>

    </div>

    <script>
        function loginDemo(event) {
            event.preventDefault();

            let mobile = document.getElementById("mobile").value;
            let password = document.getElementById("password").value;

            if (mobile.length !== 10) {
                alert("Please enter a valid 10-digit mobile number.");
                return;
            }

            if (password.length < 6) {
                alert("Password must contain at least 6 characters.");
                return;
            }

            alert("Demo Login Successful!");
        }
    </script>

</body>
</html>
