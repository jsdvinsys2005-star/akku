<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flipkart Login Demo</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f1f3f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 750px;
            min-height: 430px;
            background: white;
            display: flex;
            box-shadow: 0 3px 12px rgba(0,0,0,0.2);
        }

        .left {
            width: 40%;
            background: #2874f0;
            color: white;
            padding: 40px 30px;
        }

        .left h1 {
            font-size: 28px;
            margin-bottom: 25px;
        }

        .left p {
            font-size: 17px;
            line-height: 1.6;
            color: #e8f0ff;
        }

        .right {
            width: 60%;
            padding: 40px;
        }

        .right h2 {
            margin-bottom: 30px;
            color: #333;
        }

        input {
            width: 100%;
            padding: 14px 10px;
            margin-bottom: 20px;
            border: none;
            border-bottom: 1px solid #aaa;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-bottom: 2px solid #2874f0;
        }

        .info {
            font-size: 12px;
            color: #777;
            margin-bottom: 20px;
            line-height: 1.5;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            background: #ff9f00;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 2px;
        }

        button:hover {
            background: #fb8c00;
        }

        .new-account {
            text-align: center;
            margin-top: 30px;
            color: #2874f0;
            font-weight: bold;
        }

        #message {
            text-align: center;
            margin-top: 18px;
            color: green;
            font-weight: bold;
        }

        @media(max-width: 700px) {
            .container {
                width: 95%;
            }

            .left {
                display: none;
            }

            .right {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="left">
            <h1>Flipkart</h1>
            <p>
                Login to explore amazing products,
                great deals and exciting offers.
            </p>
        </div>

        <div class="right">
            <h2>Login</h2>

            <form id="loginForm">

                <input
                    type="text"
                    id="mobile"
                    placeholder="Enter Email / Mobile number"
                    required
                >

                <p class="info">
                    By continuing, you agree to the Terms of Use
                    and Privacy Policy.
                </p>

                <button type="submit">
                    Request OTP
                </button>

            </form>

            <div class="new-account">
                New to Flipkart? Create an account
            </div>

            <div id="message"></div>
        </div>

    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", function(e) {
            e.preventDefault();

            let mobile = document.getElementById("mobile").value;

            if (mobile.trim() === "") {
                document.getElementById("message").innerHTML =
                    "Please enter your email or mobile number.";
                return;
            }

            document.getElementById("message").innerHTML =
                "Demo OTP request submitted!";
        });
    </script>

</body>
</html>
