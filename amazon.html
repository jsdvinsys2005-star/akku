<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Login Demo</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #ffffff;
            color: #111;
        }

        .header {
            height: 70px;
            background: #131921;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo {
            color: white;
            font-size: 32px;
            font-weight: bold;
        }

        .logo span {
            color: #ff9900;
        }

        .login-box {
            width: 350px;
            margin: 35px auto;
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 25px;
        }

        h1 {
            font-size: 28px;
            font-weight: 400;
            margin-top: 0;
        }

        label {
            display: block;
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #888;
            border-radius: 4px;
            margin-bottom: 18px;
            font-size: 15px;
        }

        input:focus {
            outline: 2px solid #ff9900;
        }

        .continue {
            width: 100%;
            padding: 10px;
            background: #ffd814;
            border: 1px solid #f0c14b;
            border-radius: 20px;
            cursor: pointer;
            font-size: 15px;
        }

        .continue:hover {
            background: #f7ca00;
        }

        .info {
            font-size: 13px;
            line-height: 1.5;
            margin-top: 20px;
        }

        a {
            color: #0066c0;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 30px 0 15px;
            color: #777;
            font-size: 12px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            border-top: 1px solid #ddd;
        }

        .divider span {
            padding: 0 10px;
        }

        .create {
            width: 100%;
            padding: 9px;
            background: #fff;
            border: 1px solid #aaa;
            border-radius: 3px;
            cursor: pointer;
        }

        .footer {
            text-align: center;
            border-top: 1px solid #ddd;
            margin-top: 40px;
            padding: 25px;
            font-size: 13px;
        }

        .message {
            margin-top: 15px;
            color: green;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="header">
        <div class="logo">amazon<span>›</span></div>
    </div>

    <div class="login-box">

        <h1>Sign in</h1>

        <form id="loginForm">

            <label>Email or mobile phone number</label>
            <input
                type="text"
                id="email"
                placeholder="Enter email or mobile number"
                required
            >

            <label>Password</label>
            <input
                type="password"
                id="password"
                placeholder="Enter password"
                required
            >

            <button class="continue" type="submit">
                Continue
            </button>

        </form>

        <p class="info">
            By continuing, you agree to Amazon's
            <a href="#">Conditions of Use</a> and
            <a href="#">Privacy Notice</a>.
        </p>

        <p>
            <a href="#">Need help?</a>
        </p>

        <div class="divider">
            <span>New to Amazon?</span>
        </div>

        <button class="create" onclick="createAccount()">
            Create your Amazon account
        </button>

        <div class="message" id="message"></div>

    </div>

    <div class="footer">
        <a href="#">Conditions of Use</a> &nbsp; | &nbsp;
        <a href="#">Privacy Notice</a> &nbsp; | &nbsp;
        <a href="#">Help</a>
        <br><br>
        © 2026 Amazon-style Demo Page
    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", function(e) {
            e.preventDefault();

            document.getElementById("message").innerHTML =
                "Demo login submitted successfully!";
        });

        function createAccount() {
            document.getElementById("message").innerHTML =
                "Create account button clicked!";
        }
    </script>

</body>
</html>
