<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Login Demo</title>

    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #fafafa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 350px;
        }

        .login-box {
            background: white;
            border: 1px solid #ddd;
            padding: 40px;
            text-align: center;
        }

        .logo {
            font-family: cursive;
            font-size: 42px;
            font-weight: bold;
            margin-bottom: 35px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 5px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
            background: #fafafa;
        }

        button {
            width: 100%;
            padding: 11px;
            margin-top: 12px;
            border: none;
            border-radius: 8px;
            background: #0095f6;
            color: white;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #0077cc;
        }

        .or {
            margin: 25px 0;
            color: #888;
        }

        .facebook {
            color: #385185;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .forgot {
            color: #00376b;
            font-size: 13px;
            margin-top: 20px;
            cursor: pointer;
        }

        .signup {
            background: white;
            border: 1px solid #ddd;
            margin-top: 10px;
            padding: 20px;
            text-align: center;
        }

        .signup span {
            color: #0095f6;
            font-weight: bold;
        }

        .demo {
            margin-top: 15px;
            color: #777;
            font-size: 12px;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="login-box">

        <div class="logo">Instagram</div>

        <form onsubmit="loginDemo(event)">

            <input
                type="text"
                id="username"
                placeholder="Phone number, username, or email"
                required
            >

            <input
                type="password"
                id="password"
                placeholder="Password"
                required
            >

            <button type="submit">Log in</button>

        </form>

        <div class="or">OR</div>

        <div class="facebook">Log in with Facebook</div>

        <div class="forgot">Forgot password?</div>

    </div>

    <div class="signup">
        Don't have an account?
        <span>Sign up</span>
    </div>

    <div class="demo">
        Demo page for HTML/CSS/JavaScript practice
    </div>

</div>

<script>
function loginDemo(event) {
    event.preventDefault();

    const username = document.getElementById("username").value;

    alert("Demo login successful for: " + username);
}
</script>

</body>
</html>
